spring.application.name=TestSpring
# El 8080 lo ocupa el contenedor de Jenkins
server.port=8081

# Base de datos H2 en memoria (pruebas locales)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# API externa de Rick and Morty
rickandmorty.api.base-url=https://rickandmortyapi.com/api
